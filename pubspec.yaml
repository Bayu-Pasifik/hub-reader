name: hub_reader
description: Aplikasi pembaca komik & novel yang membaca langsung dari situs sumber di perangkat.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  # HTTP client (timeout, interceptor, error typing)
  dio: ^5.7.0
  # Navigasi deklaratif + bottom navigation yang mempertahankan state tiap tab
  go_router: ^14.6.2
  # Gambar sampul & halaman komik dengan cache disk
  cached_network_image: ^3.4.1
  # Penyimpanan lokal: favorit, riwayat, pengaturan
  shared_preferences: ^2.3.3
  # Lokasi folder cache untuk respons API (mode offline)
  path_provider: ^2.1.5
  # Menampilkan halaman bab dari situs sumber (fallback reader)
  webview_flutter: ^4.10.0
  # Parser HTML untuk extension sumber on-device (lib/sources)
  html: ^0.15.5
  # Reader: tahu halaman mana yang terlihat & bisa lompat ke halaman tersimpan
  scrollable_positioned_list: ^0.3.8
  # AES + MD5 untuk gambar bab terenkripsi Madara "chapter protector"
  pointycastle: ^4.0.0
  flutter_js: ^0.8.7
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^23.0.1
  file_picker: ^13.3.3
  local_auth: ^3.0.2
  flutter_cache_manager: ^3.5.0
  workmanager: ^0.10.10
  archive: ^4.7.0
  xml: ^7.1.0
  share_plus: ^13.3.1
  charset: 2.0.1
  lottie: ^3.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Katalog sumber template, dibuat oleh tool/generate_source_catalog.mjs
    - assets/sources/catalog.json
    # Runtime plugin novel LNReader (QuickJS), dibuat oleh tool/lnreader_runtime
    - assets/lnreader/runtime.js
    # Status awal plugin novel dari cek di PC (tool/lnreader_runtime/health.mjs)
    - assets/lnreader/health.json
    # Animasi Lottie (dibuat oleh tool/gen_lottie.mjs)
    - assets/lottie/
