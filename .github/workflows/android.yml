name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # untuk melampirkan APK ke GitHub Release saat push tag v*

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Android NDK
        # Flutter 3.50 butuh NDK 28.2; instalasi otomatis Gradle gagal di runner.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Dependensi
        run: flutter pub get

      - name: Analyze
        # Info deprecated package:flutter/material.dart belum dimigrasi; jangan gagalkan build.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Siapkan keystore rilis
        # Secrets: KEYSTORE_BASE64 (isi .jks di-base64) dan KEYSTORE_PASSWORD.
        # Tanpa secrets (mis. PR dari fork), APK ditandatangani debug key.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=hubreader"
              echo "storeFile=release.jks"
            } > android/key.properties
            echo "Keystore rilis dipakai."
          else
            echo "::warning::Secrets keystore belum diatur; APK memakai debug key."
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Ganti nama APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mv build/app/outputs/flutter-apk/app-release.apk "hub-reader-${VERSION}.apk"
          echo "APK=hub-reader-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: hub-reader-apk
          path: ${{ env.APK }}
          retention-days: 30

      - name: Lampirkan ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true

      - name: Bersihkan kredensial
        if: always()
        run: rm -f android/app/release.jks android/key.properties
